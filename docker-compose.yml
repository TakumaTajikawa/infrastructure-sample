version: '3'

services:
    terraform:
        container_name: terraform_sample
        build: ./
        working_dir: /home/
        environment:
            TF_VERSION: 1.0.0
            command: bash -c "tfenv install $$TF_VERSION && tfenv use $$TF_VERSION && tail -f /home/Dokerfile"
            volumes:
                - ~/.aws/:/root/.aws/
                - ./:/home/
